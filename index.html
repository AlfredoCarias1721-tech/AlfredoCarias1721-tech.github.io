<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Restringido</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #ff3333; /* Rojo alerta */
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            border: 2px solid #ff3333;
            padding: 40px;
            background-color: rgba(50, 0, 0, 0.5);
            box-shadow: 0 0 20px rgba(255, 51, 51, 0.4);
        }
        h1 {
            margin-top: 0;
            font-size: 2em;
        }
        p {
            color: #cccccc;
            margin-bottom: 30px;
        }
        /* Estilo del botón trampa */
        .btn-trampa {
            background-color: transparent;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 15px 30px;
            font-size: 1.2em;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-trampa:hover {
            background-color: #00ff00;
            color: #000000;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>[ ACCESO DENEGADO ]</h1>
        <p>El servidor requiere verificación manual para mostrar los archivos protegidos.</p>
        
        <button class="btn-trampa" onclick="window.location.href='https://www.youtube.com/watch?v=dQw4w9WgXcQ'">
            > VERIFICAR IDENTIDAD <
        </button>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bóveda de Conocimiento</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-principal: #0f172a;
            --bg-panel: #1e293b;
            --bg-hover: #334155;
            --texto-principal: #f8fafc;
            --texto-secundario: #94a3b8;
            --acento: #38bdf8;
            --acento-hover: #0284c7;
            --borde: #334155;
            --bg-codigo: #020617;
        }

        body {
            background-color: var(--bg-principal);
            color: var(--texto-principal);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden; /* Evita doble scroll */
        }

        /* --- Barra Lateral --- */
        .sidebar {
            width: 280px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--borde);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        .sidebar h2 { margin: 0; color: var(--acento); font-size: 1.4rem; letter-spacing: 1px; }

        .buscador-container input {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-principal);
            border: 1px solid var(--borde);
            border-radius: 8px;
            color: var(--texto-principal);
            box-sizing: border-box;
            outline: none;
        }
        .buscador-container input:focus { border-color: var(--acento); }

        .sidebar-menu { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
        .sidebar-menu button {
            width: 100%;
            background: none;
            border: none;
            color: var(--texto-secundario);
            text-align: left;
            padding: 12px 16px;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.2s;
            font-weight: 500;
        }
        .sidebar-menu button:hover, .sidebar-menu button.active {
            background-color: var(--bg-hover);
            color: var(--acento);
        }

        /* --- Contenido Principal --- */
        .contenido {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        header h1 { margin-top: 0; font-size: 2.5rem; }
        .descripcion { color: var(--texto-secundario); font-size: 1.1rem; margin-bottom: 40px; }

        .grid-apuntes {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }

        /* Tarjetas Interactivas */
        .tarjeta {
            background-color: var(--bg-panel);
            border: 1px solid var(--borde);
            border-radius: 12px;
            padding: 24px;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
        }
        .tarjeta:hover {
            transform: translateY(-4px);
            border-color: var(--acento);
        }

        .tarjeta-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .tag { background-color: rgba(56, 189, 248, 0.15); color: var(--acento); padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; text-transform: uppercase; }
        .fecha { font-size: 0.8rem; color: var(--texto-secundario); }
        .tarjeta h3 { margin: 0 0 12px 0; font-size: 1.3rem; }
        .tarjeta p { margin: 0; color: var(--texto-secundario); font-size: 0.95rem; line-height: 1.5; flex: 1; }

        /* --- Modal (Vista Detallada del Apunte) --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(2, 6, 23, 0.8);
            backdrop-filter: blur(4px);
            display: none; justify-content: center; align-items: center;
            z-index: 1000; opacity: 0; transition: opacity 0.3s;
        }
        .modal-overlay.activo { display: flex; opacity: 1; }
        
        .modal-contenido {
            background-color: var(--bg-principal);
            border: 1px solid var(--borde);
            width: 90%; max-width: 800px; max-height: 85vh;
            border-radius: 12px;
            display: flex; flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            padding: 20px 30px;
            border-bottom: 1px solid var(--borde);
            display: flex; justify-content: space-between; align-items: center;
        }
        .modal-header h2 { margin: 0; font-size: 1.5rem; color: var(--acento); }
        .btn-cerrar { background: none; border: none; color: var(--texto-secundario); font-size: 1.5rem; cursor: pointer; padding: 0; transition: 0.2s; }
        .btn-cerrar:hover { color: #f87171; }

        .modal-body {
            padding: 30px;
            overflow-y: auto;
            line-height: 1.7;
            font-size: 1.05rem;
        }

        /* Estilos para el Markdown renderizado */
        .modal-body h2, .modal-body h3 { color: #fff; margin-top: 1.5em; }
        .modal-body pre { background-color: var(--bg-codigo); padding: 16px; border-radius: 8px; border: 1px solid var(--borde); overflow-x: auto; }
        .modal-body code { font-family: 'Courier New', Courier, monospace; color: #e2e8f0; font-size: 0.9em; }
        .modal-body p code { background-color: var(--bg-codigo); padding: 2px 6px; border-radius: 4px; }
        .modal-body blockquote { border-left: 4px solid var(--acento); margin: 0; padding-left: 16px; color: var(--texto-secundario); }

        /* Adaptabilidad Móvil */
        @media (max-width: 768px) {
            body { flex-direction: column; overflow: auto; height: auto; }
            .sidebar { width: auto; height: auto; border-right: none; border-bottom: 1px solid var(--borde); padding: 20px; }
            .contenido { padding: 20px; }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <h2>Mi Bóveda</h2>
        <div class="buscador-container">
            <input type="text" id="inputBusqueda" placeholder="Buscar apuntes, código, temas..." onkeyup="filtrarApuntes()">
        </div>
        <ul class="sidebar-menu" id="menuCategorias">
            </ul>
    </aside>

    <main class="contenido">
        <header>
            <h1>Repositorio Central</h1>
            <p class="descripcion">Documentación técnica renderizada interactivamente.</p>
        </header>
        <section class="grid-apuntes" id="contenedorApuntes">
            </section>
    </main>

    <div class="modal-overlay" id="modal" onclick="cerrarModal(event)">
        <div class="modal-contenido" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h2 id="modalCategoria">Categoría</h2>
                <button class="btn-cerrar" onclick="cerrarModalFuerza()">✖</button>
            </div>
            <div class="modal-body">
                <h1 id="modalTitulo" style="margin-top:0; margin-bottom: 8px;">Título</h1>
                <div class="fecha" id="modalFecha" style="margin-bottom: 24px;"></div>
                <div id="modalContenidoMarkdown"></div>
            </div>
        </div>
    </div>

    <script src="apuntes.js"></script>
    
    <script>
        let categoriaActiva = 'todos';

        // 1. Iniciar la página
        document.addEventListener('DOMContentLoaded', () => {
            generarMenu();
            renderizarTarjetas(misApuntes);
        });

        // 2. Extraer categorías únicas y crear el menú
        function generarMenu() {
            const menu = document.getElementById('menuCategorias');
            const categoriasUnicas = [...new Set(misApuntes.map(apunte => apunte.categoria))];
            
            // Botón por defecto
            menu.innerHTML = `<li><button class="active" id="btn-todos" onclick="cambiarCategoria('todos')">📁 Ver Todo</button></li>`;
            
            // Crear botón por cada categoría encontrada
            categoriasUnicas.forEach(cat => {
                menu.innerHTML += `<li><button id="btn-${cat}" onclick="cambiarCategoria('${cat}')">🔖 ${cat}</button></li>`;
            });
        }

        // 3. Crear las tarjetas en pantalla
        function renderizarTarjetas(datos) {
            const contenedor = document.getElementById('contenedorApuntes');
            contenedor.innerHTML = ''; // Limpiar contenedor

            if(datos.length === 0) {
                contenedor.innerHTML = '<p style="color: var(--texto-secundario)">No se encontraron apuntes.</p>';
                return;
            }

            datos.forEach(apunte => {
                const tarjeta = document.createElement('div');
                tarjeta.className = 'tarjeta';
                // Al hacer clic, abre el modal y le pasa el ID del apunte
                tarjeta.onclick = () => abrirModal(apunte.id);
                
                tarjeta.innerHTML = `
                    <div class="tarjeta-header">
                        <span class="tag">${apunte.categoria}</span>
                        <span class="fecha">${apunte.fecha}</span>
                    </div>
                    <h3>${apunte.titulo}</h3>
                    <p>${apunte.resumen}</p>
                `;
                contenedor.appendChild(tarjeta);
            });
        }

        // 4. Sistema de Filtrado Combinado (Por Categoría y Búsqueda)
        function cambiarCategoria(categoria) {
            categoriaActiva = categoria;
            
            // Actualizar diseño de botones
            document.querySelectorAll('.sidebar-menu button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${categoria}`).classList.add('active');
            
            filtrarApuntes();
        }

        function filtrarApuntes() {
            const textoBusqueda = document.getElementById('inputBusqueda').value.toLowerCase();
            
            const resultados = misApuntes.filter(apunte => {
                const coincideCategoria = (categoriaActiva === 'todos' || apunte.categoria === categoriaActiva);
                const coincideTexto = (
                    apunte.titulo.toLowerCase().includes(textoBusqueda) || 
                    apunte.resumen.toLowerCase().includes(textoBusqueda) ||
                    apunte.contenido.toLowerCase().includes(textoBusqueda)
                );
                return coincideCategoria && coincideTexto;
            });

            renderizarTarjetas(resultados);
        }

        // 5. Lógica del Modal (Vista Detallada)
        function abrirModal(id) {
            const apunte = misApuntes.find(a => a.id === id);
            
            document.getElementById('modalCategoria').innerText = apunte.categoria;
            document.getElementById('modalTitulo').innerText = apunte.titulo;
            document.getElementById('modalFecha').innerText = `Actualizado: ${apunte.fecha}`;
            
            // Renderizar Markdown a HTML usando la librería
            document.getElementById('modalContenidoMarkdown').innerHTML = marked.parse(apunte.contenido);
            
            document.getElementById('modal').classList.add('activo');
        }

        function cerrarModal(evento) {
            // Cierra si haces clic en el fondo oscuro
            if (evento.target.id === 'modal') {
                document.getElementById('modal').classList.remove('activo');
            }
        }

        function cerrarModalFuerza() {
            document.getElementById('modal').classList.remove('activo');
        }
    </script>
</body>
</html>

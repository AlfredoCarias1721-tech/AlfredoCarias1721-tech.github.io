<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clasificado - Acceso de Nivel 5</title>
    <style>
        body {
            background-color: #000;
            color: #0f0; /* Verde matrix */
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            font-size: 1.1em;
            line-height: 1.4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 90vh;
            margin: 0;
            overflow: hidden;
        }
        #terminal-container {
            width: 80%;
            max-width: 900px;
            text-align: left;
        }
        .error { color: #f00; } /* Texto rojo para errores */
        .warning { color: #ff0; } /* Texto amarillo para advertencias */
        
        #final-action {
            display: none; /* Oculto hasta el final */
            margin-top: 30px;
            text-align: center;
        }
        .rick-button {
            background-color: transparent;
            color: #0f0;
            border: 2px solid #0f0;
            padding: 15px 30px;
            font-size: 1.3em;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 10px rgba(0,255,0,0.5);
        }
        .rick-button:hover {
            background-color: #0f0;
            color: #000;
            box-shadow: 0 0 20px rgba(0,255,0,0.8);
        }
    </style>
</head>
<body>

<div id="terminal-container">
    <div id="terminal-content"></div>
    <div id="final-action">
        <p class="warning">*** ADVERTENCIA: La descompresión requiere confirmación manual ***</p>
        <button class="rick-button" onclick="rickRoll()">> DESCOMPRIMIR PAQUETE DE DATOS <</button>
    </div>
</div>

<script>
    const content = document.getElementById('terminal-content');
    const finalAction = document.getElementById('final-action');

    // Esta es la secuencia larga de eventos. ¡Puedes agregar más!
    const logs = [
        { t: "[ INTRODUCIENDO CREDENCIALES DE AGENTE ]", d: 1000 },
        { t: "Estableciendo conexión segura vía túnel SSH encriptado...", d: 2000 },
        { t: "[-] Bypass del Firewall del servidor proxy... <span class='warning'>[OK]</span>", d: 1500 },
        { t: "[-] Inyectando payload criptográfico en el sector de arranque...", d: 1800 },
        { t: "[ ERROR DE AUTENTICACIÓN ] - Reintentando con exploit secundario...", d: 2500, class: 'error' },
        { t: "[-] Escalada de privilegios exitosa. Root access concedido.", d: 2000 },
        { t: "[ INICIANDO PROTOCOLO DE DESCRIPCIÓN DE DATOS ]", d: 1000 },
        { t: "Descifrando bloque de memoria 0x00A1... [##########] 10%", d: 1500 },
        { t: "Descifrando bloque de memoria 0x00A2... [####################] 30%", d: 2000 },
        { t: "<span class='warning'>[ ALERTA ]</span> Intento de rastreo detectado. Desviando tráfico por servidores en Jordania...", d: 3000 },
        { t: "Descifrando bloque de memoria 0x00A3... [##############################] 60%", d: 2500 },
        { t: "Descifrando bloque de memoria 0x00A4... [########################################] 90%", d: 1800 },
        { t: "Recomponiendo estructura de archivos confidenciales...", d: 2000 },
        { t: "[!] PROCESO COMPLETADO EXIOTOSAMENTE [!]", d: 1500 },
        { t: "Paquete de datos 'operacion_rick_v2.tar.gz' listo para visualización.", d: 1000 },
    ];

    let currentLog = 0;

    function printLog() {
        if (currentLog < logs.length) {
            const log = logs[currentLog];
            const p = document.createElement('p');
            if (log.class) p.className = log.class;
            p.innerHTML = log.t;
            content.appendChild(p);
            
            // Auto-scroll hacia abajo
            window.scrollTo(0, document.body.scrollHeight);

            currentLog++;
            setTimeout(printLog, log.d); // Espera el tiempo definido para este log
        } else {
            // Cuando termina toda la secuencia, mostramos el botón
            finalAction.style.display = 'block';
            window.scrollTo(0, document.body.scrollHeight);
        }
    }

    function rickRoll() {
        window.location.href = 'https://www.youtube.com/watch?v=dQw4w9WgXcQ';
    }

    // Iniciar la secuencia al cargar la página
    window.onload = printLog;
</script>

</body>
</html>
